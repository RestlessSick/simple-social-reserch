<form id='register-form' class="container-fluid form" method='post' action={% url 'auth:register' %}>
    <p class='lead'> Register </p>
    {% csrf_token %}
    {{ form }}
    <input type="submit" class="btn btn-primary btn-md">
</form>

<script>
    document.getElementById('register-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        
        let form = await new FormData(document.getElementById('register-form'));
        fetch('{% url "auth:register" %}', {
            method: 'post',
            body: form
        }).then(async response => {
            if (!response.ok) {
                message("Ошибка регистрации. Проверьте введённые данные, или подключение к Интернету.");
            }
            else {
                await message('Вы успешно зарегистрировались!');
                response.json().then(result => {
                    fetch('/api-auth/token/obtain/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': "application/json",
                        },
                        body: JSON.stringify(result),
                    }).then(async response => {
                        if (!response.ok) {
                            await message('Токен не был получен. Перезагрузите страницу.');
                        }   
                        else {
                            await message('Токен обновился.');
                            window.location.reload();
                        }
                    });
                });
            }
        });
    });

</script>
